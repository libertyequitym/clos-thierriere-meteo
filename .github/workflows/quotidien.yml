name: Mise à jour quotidienne météo Clos Thierrière

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meteo:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils
        run: pip install -r requirements.txt

      - name: Lancer le robot météo
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
        run: python update_meteo.py

      - name: Sauvegarder les fichiers mis à jour
        run: |
          git config user.name "robot-meteo"
          git config user.email "robot@closthierriere.fr"
          git add clos_thierriere_climato.xlsx donnees_brutes.parquet donnees_tours.parquet
          git diff --staged --quiet || git commit -m "MAJ météo automatique $(date +%Y-%m-%d)"
          git push
